<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Gestione recensioni | FLORA</title>
  <style>
    :root{--green:#69bf45;--dark:#0b4a2f;--lime:#b8ef68;--cream:#fbfaf4;--sage:#edf6e8;--text:#102016;--muted:#647164;--line:rgba(16,32,22,.12);--danger:#a93434;--shadow:0 24px 70px rgba(18,68,38,.14)}
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#f4f9f0,#fbfaf4);min-height:100vh}.container{width:min(1080px,calc(100% - 30px));margin:auto;padding:34px 0 70px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.logo{height:45px}.home{padding:11px 16px;border-radius:999px;background:white;border:1px solid var(--line);color:var(--dark);font-weight:800;text-decoration:none}.hero{padding:32px;border-radius:28px;background:linear-gradient(140deg,#072c20,#0b4a2f 64%,#3e7e2d);color:white;box-shadow:var(--shadow);margin-bottom:22px}.hero h1{margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,54px);letter-spacing:-.04em}.hero p{margin:0;color:rgba(255,255,255,.75);line-height:1.65}.login,.toolbar,.empty,.review{background:white;border:1px solid var(--line);box-shadow:0 16px 45px rgba(18,68,38,.07)}.login{padding:25px;border-radius:22px;display:flex;gap:10px;align-items:end}.field{display:grid;gap:7px;flex:1}.field label{font-size:13px;font-weight:850;color:var(--dark)}input,select{min-height:48px;padding:0 14px;border:1px solid rgba(11,74,47,.18);border-radius:14px;background:#f8fbf5;font:inherit}.btn{min-height:48px;padding:0 18px;border:0;border-radius:14px;font-weight:900;cursor:pointer}.primary{background:var(--dark);color:white}.approve{background:var(--green);color:#082619}.reject{background:#fff0f0;color:var(--danger);border:1px solid rgba(169,52,52,.18)}.toolbar{display:none;padding:16px;border-radius:20px;margin:18px 0;align-items:center;justify-content:space-between;gap:12px}.toolbar.visible{display:flex}.toolbar-group{display:flex;gap:9px;align-items:center}.status{color:var(--muted);font-size:14px}.reviews{display:grid;gap:14px}.review{padding:24px;border-radius:22px}.review-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.review h2{margin:0;font-size:20px}.stars{color:#67a62f;letter-spacing:.1em}.review blockquote{margin:18px 0;color:#3f4d43;line-height:1.75;font-size:16px}.meta{font-size:12px;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.empty{display:none;padding:36px;text-align:center;border-radius:22px;color:var(--muted)}.empty.visible{display:block}.message{margin-top:12px;color:var(--danger);font-weight:700;font-size:14px}
    @media(max-width:620px){.container{width:calc(100% - 20px);padding-top:18px}.login{align-items:stretch;flex-direction:column}.toolbar,.toolbar.visible{align-items:stretch;flex-direction:column}.toolbar-group{flex-wrap:wrap}.review-head{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="container">
    <header class="header"><img class="logo" src="./logo.png" alt="FLORA"><a class="home" href="index.html">Torna al sito</a></header>
    <section class="hero"><h1>Gestione recensioni</h1><p>Accedi con la chiave riservata di FLORA, controlla le nuove testimonianze e scegli quali pubblicare sul sito.</p></section>

    <section class="login" id="loginBox">
      <div class="field"><label for="adminToken">Chiave riservata</label><input id="adminToken" type="password" autocomplete="current-password" placeholder="Inserisci la chiave amministratore"></div>
      <button class="btn primary" id="loginButton" type="button">Accedi</button>
      <div class="message" id="loginMessage" role="status"></div>
    </section>

    <section class="toolbar" id="toolbar">
      <div class="toolbar-group"><strong>Recensioni</strong><select id="statusFilter"><option value="pending">In attesa</option><option value="approved">Pubblicate</option><option value="rejected">Rifiutate</option><option value="all">Tutte</option></select></div>
      <div class="toolbar-group"><span class="status" id="countLabel"></span><button class="btn primary" id="refreshButton" type="button">Aggiorna</button></div>
    </section>

    <div class="reviews" id="reviewsList"></div>
    <div class="empty" id="emptyState">Non ci sono recensioni in questa categoria.</div>
  </main>

  <script>
    const tokenInput=document.getElementById("adminToken");
    const loginButton=document.getElementById("loginButton");
    const loginMessage=document.getElementById("loginMessage");
    const toolbar=document.getElementById("toolbar");
    const statusFilter=document.getElementById("statusFilter");
    const refreshButton=document.getElementById("refreshButton");
    const reviewsList=document.getElementById("reviewsList");
    const emptyState=document.getElementById("emptyState");
    const countLabel=document.getElementById("countLabel");
    let adminToken=sessionStorage.getItem("floraReviewsToken")||"";

    function formatDate(value){if(!value)return "";const normalized=value.includes("T")?value:value.replace(" ","T")+"Z";return new Intl.DateTimeFormat("it-IT",{dateStyle:"medium",timeStyle:"short"}).format(new Date(normalized))}
    function authHeaders(){return {"Authorization":`Bearer ${adminToken}`,"Content-Type":"application/json"}}

    function renderReviews(items){
      reviewsList.replaceChildren();
      emptyState.classList.toggle("visible",items.length===0);
      countLabel.textContent=`${items.length} recension${items.length===1?"e":"i"}`;
      items.forEach(item=>{
        const card=document.createElement("article");card.className="review";
        const head=document.createElement("div");head.className="review-head";
        const title=document.createElement("h2");title.textContent=item.name;
        const stars=document.createElement("div");stars.className="stars";stars.textContent="★".repeat(item.rating)+"☆".repeat(5-item.rating);
        head.append(title,stars);
        const quote=document.createElement("blockquote");quote.textContent=item.review;
        const meta=document.createElement("div");meta.className="meta";meta.textContent=`Ricevuta il ${formatDate(item.created_at)} · Stato: ${item.status}`;
        const actions=document.createElement("div");actions.className="actions";
        if(item.status!=="approved")actions.append(makeAction("Approva e pubblica","approve","approve",item.id));
        if(item.status!=="rejected")actions.append(makeAction("Rifiuta","reject","reject",item.id));
        card.append(head,quote,meta,actions);reviewsList.append(card);
      });
    }

    function makeAction(label,className,action,id){const button=document.createElement("button");button.type="button";button.className=`btn ${className}`;button.textContent=label;button.addEventListener("click",()=>moderate(id,action));return button}

    async function loadReviews(){
      loginMessage.textContent="";
      try{
        const response=await fetch(`/api/admin/reviews?status=${encodeURIComponent(statusFilter.value)}`,{headers:authHeaders()});
        if(response.status===401)throw new Error("Chiave non corretta.");
        if(!response.ok)throw new Error("Impossibile caricare le recensioni.");
        const data=await response.json();
        sessionStorage.setItem("floraReviewsToken",adminToken);toolbar.classList.add("visible");renderReviews(data.reviews);
      }catch(error){toolbar.classList.remove("visible");reviewsList.replaceChildren();emptyState.classList.remove("visible");loginMessage.textContent=error.message}
    }

    async function moderate(id,action){
      const response=await fetch(`/api/admin/reviews/${id}`,{method:"PATCH",headers:authHeaders(),body:JSON.stringify({action})});
      if(!response.ok){alert("Operazione non riuscita. Aggiorna la pagina e riprova.");return}await loadReviews();
    }

    loginButton.addEventListener("click",()=>{adminToken=tokenInput.value.trim();loadReviews()});
    tokenInput.addEventListener("keydown",event=>{if(event.key==="Enter"){adminToken=tokenInput.value.trim();loadReviews()}});
    statusFilter.addEventListener("change",loadReviews);refreshButton.addEventListener("click",loadReviews);
    if(adminToken){tokenInput.value=adminToken;loadReviews()}
  </script>
</body>
</html>
